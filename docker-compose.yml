services:

  financial-rag-assistant:

    build: .

    container_name: financial-rag-assistant

    ports:
      - "8501:8501"

    volumes:
      - .:/app

    environment:
      - PYTHONUNBUFFERED=1
      - PREFECT_API_URL=http://prefect-server:4200/api


  prefect-server:

    image: prefecthq/prefect:3-python3.12

    container_name: prefect-server

    command:
      - prefect
      - server
      - start
      - --host
      - 0.0.0.0

    ports:
      - "4200:4200"